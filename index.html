<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DesignCraft | Web Development & Design Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- GitHub Pages query string to path converter -->
    <script>
      (function() {
        var location = window.location;
        if (location.search.slice(1)) {
          var decoded = decodeURIComponent(location.search.slice(1));
          var redirect = location.pathname.slice(0, -1) + decoded.replace(/&/g, '?').replace(/~and~/g, '&') + location.hash;
          sessionStorage.redirect = redirect;
          history.replaceState(null, null, location.pathname.slice(0, -1) + '/?' + location.search.slice(1) + location.hash);
        }
      })();
    </script>
  </body>
</html>
