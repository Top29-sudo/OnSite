<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment
      (function() {
        var pathSegmentsToKeep = 1; // Change this if you use a custom domain (0) or GitHub project page (1)
        
        var location = window.location;
        var redirect = location.protocol + '//' + location.host + '/' + 
          location.pathname.split('/').slice(0, pathSegmentsToKeep + 1).join('/') +
          '/?/' + 
          location.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
          location.hash;
        
        window.location.replace(redirect);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
